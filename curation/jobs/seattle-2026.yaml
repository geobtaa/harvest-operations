# ArcGIS curation job template. Setup notes and optional fields:
# arcgis_curation_pipeline_reference.md
version: 1

job:
  id: "seattle-2026"
  work_directory: "../work/seattle-2026"

provider: BTAA-GIN

hub:
  name: "Seattle GeoData"
  landing_page: "https://data-seattlecitygis.opendata.arcgis.com"
  dcat_api: "https://data-seattlecitygis.opendata.arcgis.com/api/feed/dcat-us/1.1.json"
  website_reference_id: "16c-01"
  websites_csv: ../../reference_data/websites.csv

coordinate_reference_system:
  authority: "EPSG:2926"
  uri: "https://spatialreference.org/ref/epsg/2926/"

metadata:
  code: "b1g_53_63000"
  member_of: b1g_urbanBaseLayers
  export_date: "2026-08-12"

selection_criteria:
  allowed_resource_types:
    - Polygon data
    - Line data
    - Point data

manual_review:
  required_fields:
    - filename
    - ID
    - Title
    - Description
    - Creator
    - Publisher
    - Provider
    - Resource Class
    - Rights
    - Access Rights

derivatives:
  pmtiles_config: ../pmtiles_config.sample.json

# Fill the layers the Hub provides and delete unused rows.
records:
  - id: "5ef414c3cf73436a84bff413129e67e7_0"
    filename: "sea_address_2026"
    basic_theme: Address points

  - id: "1ea2f226716e417e8a554476f4337c51_0"
    filename: "sea_buildings_2023"
    basic_theme: Building footprints

  - id: "4fbe28084541458e9b393b112ff76e86_0"
    filename: "sea_boundary_2026"
    basic_theme: Municipal boundary

  - id: "9baab63b52df417a9b2a168e3f288b1b_2"
    filename: "sea_parks_2026"
    basic_theme: Parks

  - id: "f91318f1cc43489fb0e7aca2fde22899_0"
    filename: "sea_streets_2026"
    basic_theme: Streets

  - id: "dd29065b5d01420e9686570c2b77502b_0"
    filename: "sea_zoning_2026"
    basic_theme: Zoning

  - id: "db783659194f47ef8fbd8e010c102809_0"

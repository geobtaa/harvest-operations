          areas-concentrated-poverty/2017-society_areas_of_concntrtd_pvrty
        metadata_overrides:
          Display Note: >-
            This historical dataset uses 2011-2015 American Community Survey
            estimates. It was superseded by the Metropolitan Council's Equity
            Considerations dataset, which was formerly known as Areas of
            Concentrated Poverty and was greatly expanded to support more
            nuanced place-based equity analysis.
          Admin Note: >-
            Snapshot year: 2017; source resource GUID:
            c7cd8fa6-ea1d-4ea5-bc25-5adf26971f3b. The source metadata states that
            the tract attributes use 2011-2015 American Community Survey
            estimates.


# ArcGIS curation job template. Setup notes and optional fields:
# arcgis_curation_pipeline_reference.md
version: 1

job:
  id: "newark-2026"
  work_directory: "../work/newark-2026"

provider: BTAA-GIN

hub:
  name: "NewGIN"
  landing_page: "https://data-newgin.opendata.arcgis.com"
  dcat_api: "https://data-newgin.opendata.arcgis.com/api/feed/dcat-us/1.1.json"
  website_reference_id: "14c-01"
  websites_csv: ../../reference_data/websites.csv

coordinate_reference_system:
  authority: "EPSG:3424"
  uri: "https://spatialreference.org/ref/epsg/3424/"

metadata:
  code: "b1g_34_51000"
  member_of: b1g_urbanBaseLayers
  export_date: "2026-10-08"

selection_criteria:
  allowed_resource_types:
    - Polygon data
    - Line data
    - Point data

manual_review:
  required_fields:
    - filename
    - ID
    - Title
    - Description
    - Creator
    - Publisher
    - Provider
    - Resource Class
    - Rights
    - Access Rights

derivatives:
  pmtiles_config: ../pmtiles_config.sample.json

# Fill the layers the Hub provides and delete unused rows.
records:
  - id: "9cc2fe7ccbfc417d9ff8cdc60094cb7e_0"
    filename: "nwk_address_2026"
    basic_theme: Address points

  - id: "e94e03652d1c4ca787db85100ad88c01_0"
    filename: "nwk_buildings_2026"
    basic_theme: Building footprints

  - id: "0a1caa483cbf4733a493cc1c23d5c491_1"
    filename: "nwk_boundary_2026"
    basic_theme: Municipal boundary

  - id: "62a9af74e5ac48f796c6bd755e45e160_1"
    filename: "nwk_parks_2026"
    basic_theme: Parks

  - id: "a96cd823c7f24d7690dede575fa25791_6"
    filename: "nwk_streets_2026"
    basic_theme: Streets

  - id: "d334f4b38a4b41fb90986cb24d42d45a_0"
    filename: "nwk_zoning_2026"
    basic_theme: Zoning
